<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iTopCPToolkit: the Config GUI</title>
    <!--
      Apply the stored theme before the first paint, so a dark-mode user never
      sees a white flash.  Kept in sync with src/hooks/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('itopcptoolkit.theme') || 'system'
          var dark = pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* private mode: fall back to the CSS default */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
