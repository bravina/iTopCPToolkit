# .github/workflows/test.yml
#
# Runs all automated tests on every pull request and every push to main.
#
# Jobs:
#   test-backend   – pytest for the ConfigFactory introspection and the Flask
#                    routes, inside an AnalysisBase container.  The backend is
#                    a mirror of Athena's live ConfigFactory, so it is tested
#                    against the real thing: there is deliberately no stand-in,
#                    and the suite refuses to run without Athena (conftest.py).
#   test-frontend  – vitest unit tests for all JS utility modules + a production build
#
# The AnalysisBase image is public (deploy.yml pulls it without logging in to
# that registry), so no CERN credentials are needed here.  It ships Athena but
# not TopCPToolkit, and the tests do not require TCT.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # ── Backend: factory introspection + Flask routes ───────────────────────────
  test-backend:
    runs-on: ubuntu-latest

    container:
      # Keep the tag in sync with AB_TAG in the Dockerfile.
      image: gitlab-registry.cern.ch/atlas/athena/analysisbase:25.2.106
      # The image's default user is `atlas`; root is needed to write into the
      # runner workspace and to pip-install into the release Python.
      options: --user root

    steps:
      - uses: actions/checkout@v6

      # Every `run` step below re-sources the release setup, because GitHub
      # Actions starts a fresh shell per step.  The environment deliberately is
      # NOT exported once into $GITHUB_ENV: release_setup.sh does more than set
      # variables (it defines shell functions such as asetup), and only plain
      # variables survive a $GITHUB_ENV round-trip.
      - name: Install Python dependencies
        run: |
          source /home/atlas/release_setup.sh
          # pip is not always present in the release Python — same bootstrap as
          # the Dockerfile.
          python3 -m ensurepip --upgrade 2>/dev/null \
            || (curl -sSL https://bootstrap.pypa.io/get-pip.py | python3)
          python3 -m pip install --quiet flask flask-cors pyyaml pytest

      - name: Run backend tests
        working-directory: backend
        run: |
          source /home/atlas/release_setup.sh
          pytest tests/ -v

  # ── Frontend: utility unit tests ────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend (catches JSX/import errors)
        working-directory: frontend
        run: npm run build
